[project]
name = "dotclaude"
version = "0.1.0"
description = "Shared Claude Code configuration"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
# The session reader runs on the stock macOS python3 in every project, not on this repo's virtual environment
per-file-target-version = { "scripts/sessions.py" = "py39", "scripts/transcript.py" = "py39" }
